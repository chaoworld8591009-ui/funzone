<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="我的收藏"/>
<title>我的收藏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0a;--card:#161616;--card2:#1c1c1c;--border:#252525;--border2:#2a2a2a;
  --text:#fff;--muted:#888;--muted2:#555;
  --amber:#FF9500;--amber-bg:#1e1200;
  --green:#30D158;--green-bg:#0a1a0a;
  --blue:#4DA6FF;--blue-bg:#001525;
  --red:#FF453A;--red-bg:#1a0808;
  --purple:#BF5AF2;--purple-bg:#160025;
  --yellow:#FFD60A;--yellow-bg:#1a1500;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;overflow:hidden;}
.app{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;}
.header{padding:16px 20px 10px;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0;}
.header-back{color:var(--amber);font-size:16px;cursor:pointer;padding:4px 8px 4px 0;}
.header-title{flex:1;font-size:18px;font-weight:700;}
.header-action{color:var(--amber);font-size:14px;cursor:pointer;}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
.page.chat-page{overflow:hidden;}
.bottom-nav{background:var(--card);border-top:0.5px solid var(--border);display:flex;flex-shrink:0;}
.nav-btn{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.nav-ico{font-size:18px;line-height:1;}
.nav-lbl{font-size:10px;color:var(--muted);}
.nav-btn.active .nav-lbl{color:var(--amber);}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:0.5px solid var(--border);cursor:pointer;}
.list-item:active{background:var(--card);}
.list-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;}
.list-body{flex:1;min-width:0;}
.list-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.list-arrow{color:var(--muted2);font-size:18px;}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;display:inline-block;white-space:nowrap;}
.tag-loc{background:var(--blue-bg);color:var(--blue);}
.tag-eat{background:var(--amber-bg);color:var(--amber);}
.tag-play{background:var(--green-bg);color:var(--green);}
.tag-buy{background:var(--purple-bg);color:var(--purple);}
.tag-go{background:var(--red-bg);color:var(--red);}
.tag-shop{background:var(--blue-bg);color:var(--blue);}
.stars{color:var(--amber);font-size:12px;}
.section-hdr{font-size:11px;color:var(--muted2);padding:10px 20px 4px;text-transform:uppercase;letter-spacing:0.5px;}
.filter-bar{display:flex;gap:8px;padding:10px 20px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:0.5px solid var(--border);}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-pill{font-size:12px;padding:5px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;border:0.5px solid var(--border2);color:var(--muted);background:transparent;flex-shrink:0;}
.filter-pill.active{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700;}
.photo-swiper{width:100%;height:300px;position:relative;overflow:hidden;flex-shrink:0;background:#000;}
.photo-swiper-track{display:flex;height:100%;transition:transform 0.3s ease;}
.photo-swiper-slide{min-width:100%;height:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;}
.photo-swiper-slide img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain;}
.slide-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;}
.photo-swiper-overlay{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:1;}
.photo-dots{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;}
.photo-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.35);}
.photo-dot.on{background:#fff;}
.photo-count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;padding:3px 8px;border-radius:20px;z-index:2;}
.photo-add-btn{background:rgba(0,0,0,0.65);color:var(--amber);font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;border:none;font-family:inherit;}
.photo-add-video-btn{background:rgba(0,0,0,0.65);color:var(--purple);font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;border:none;font-family:inherit;}
.photo-btn-row{position:absolute;bottom:8px;right:10px;display:flex;gap:6px;z-index:3;}
.photo-del-btn{position:absolute;bottom:8px;left:10px;background:rgba(0,0,0,0.6);color:var(--red);font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:2;}
.photo-cover-btn{position:absolute;bottom:8px;left:90px;background:rgba(0,0,0,0.65);color:var(--yellow);font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:2;}
.photo-cover-btn.is-cover{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow);}

/* 全螢幕燈箱 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.lightbox.hidden{display:none;}
.lightbox-media{max-width:100%;max-height:85vh;object-fit:contain;border-radius:4px;}
.lightbox-close{position:absolute;top:16px;right:16px;color:#fff;font-size:28px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.15);border-radius:50%;}
.lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:32px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.15);border-radius:50%;}
.lightbox-prev{left:10px;}
.lightbox-next{right:10px;}
.lightbox-count{position:absolute;bottom:20px;color:rgba(255,255,255,0.6);font-size:13px;}

/* 影片樣式 */
.photo-swiper-slide video{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain;background:#000;}
.media-type-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:20px;z-index:2;}
.detail-body{padding:16px 20px;flex:1;overflow-y:auto;}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.detail-name{font-size:22px;font-weight:700;margin-bottom:6px;}
.detail-stars-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.detail-star{font-size:26px;cursor:pointer;color:var(--muted2);}
.detail-star.on{color:var(--amber);}
.detail-section{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;margin-top:12px;}
.detail-val{font-size:14px;color:#ccc;line-height:1.6;}
.detail-link{font-size:14px;color:var(--blue);word-break:break-all;cursor:pointer;}
.detail-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.detail-btn{padding:12px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;}
.btn-nav{background:var(--blue-bg);color:var(--blue);}
.btn-link{background:var(--blue-bg);color:var(--blue);}
.btn-edit{background:var(--yellow-bg);color:var(--yellow);}
.btn-done{background:var(--green-bg);color:var(--green);}
.btn-del{background:var(--red-bg);color:var(--red);}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-wrap.hidden{display:none;}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center;}
.modal-input{width:100%;background:var(--card2);border:0.5px solid var(--border2);border-radius:10px;padding:12px;font-size:15px;color:var(--text);margin-bottom:10px;font-family:inherit;}
.modal-input::placeholder{color:var(--muted2);}
.modal-label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block;}
.modal-btns{display:flex;gap:8px;margin-top:4px;}
.modal-btn{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;border:none;font-family:inherit;}
.modal-btn-cancel{background:var(--card2);color:var(--muted);}
.modal-btn-ok{background:var(--amber);color:#000;}
.modal-btn-danger{background:var(--red-bg);color:var(--red);}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.emoji-opt{font-size:24px;padding:6px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
.emoji-opt.sel{border-color:var(--amber);background:var(--amber-bg);}
.star-picker{display:flex;gap:4px;margin-bottom:12px;}
.star-pick{font-size:28px;cursor:pointer;color:var(--muted2);}
.star-pick.on{color:var(--amber);}
.photo-upload{width:100%;background:var(--card2);border:0.5px dashed var(--border2);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:10px;}
.photo-preview{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block;}
.edit-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);}
.edit-list-name{flex:1;font-size:14px;}
.edit-btn{font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer;border:none;font-family:inherit;}
.edit-btn-del{background:var(--red-bg);color:var(--red);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;line-height:2;}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}

/* Login page */
.login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px 20px;gap:20px;}
.login-logo{font-size:60px;margin-bottom:10px;}
.login-title{font-size:28px;font-weight:700;}
.login-sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;}
.login-btn{width:100%;max-width:320px;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;}
.login-btn-google{background:#fff;color:#333;}
.login-btn-email{background:var(--amber);color:#000;}
.login-divider{color:var(--muted);font-size:13px;}

/* Friends page */
.friend-card{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:0.5px solid var(--border);cursor:pointer;}
.friend-avatar{width:44px;height:44px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.friend-avatar img{width:100%;height:100%;object-fit:cover;}
.friend-body{flex:1;}
.friend-name{font-size:15px;font-weight:600;}
.friend-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.friend-action{color:var(--amber);font-size:13px;}
.profile-section{padding:20px;border-bottom:0.5px solid var(--border);}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;overflow:hidden;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-name{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px;}
.profile-email{text-align:center;font-size:13px;color:var(--muted);}
.profile-id{text-align:center;font-size:12px;color:var(--muted2);margin-top:4px;}
.sync-badge{position:absolute;top:10px;right:60px;background:var(--green-bg);color:var(--green);font-size:11px;padding:3px 8px;border-radius:20px;}
.sync-badge.syncing{background:var(--amber-bg);color:var(--amber);}

/* 搜尋 */
.search-bar{padding:8px 14px;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0;}
.search-input{width:100%;background:var(--card2);border:0.5px solid var(--border2);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;}
.search-input::placeholder{color:var(--muted2);}

/* 排序 */
.sort-bar{display:flex;gap:6px;padding:6px 14px 8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.sort-bar::-webkit-scrollbar{display:none;}
.sort-pill{font-size:12px;padding:4px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;border:0.5px solid var(--border2);color:var(--muted);background:transparent;flex-shrink:0;}
.sort-pill.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700;}

/* 長按刪除 */
.list-item.pressing{background:var(--red-bg) !important;transition:background 0.15s;}

/* ===== 旅遊規劃 ===== */
.trip-card{background:var(--card);border-radius:14px;margin:10px 16px;border:0.5px solid var(--border);overflow:hidden;cursor:pointer;}
.trip-cover{height:110px;position:relative;display:flex;align-items:flex-end;padding:10px 12px;}
.trip-cover-emoji{position:absolute;top:10px;right:12px;font-size:32px;}
.trip-cover-grad{position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,0.7));}
.trip-info{position:relative;z-index:1;}
.trip-name{color:#fff;font-size:15px;font-weight:700;}
.trip-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.trip-body{padding:10px 12px;}
.day-block{margin:0 14px 10px;background:var(--card);border-radius:12px;border:0.5px solid var(--border);overflow:hidden;}
.day-hdr{background:var(--card2);padding:8px 12px;display:flex;align-items:center;gap:8px;}
.day-num-badge{background:var(--amber);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
.day-date-txt{color:var(--muted);font-size:11px;}
.day-loc{color:var(--muted2);font-size:10px;margin-left:auto;}
.itin-item{display:flex;gap:8px;padding:8px 12px;border-bottom:0.5px solid var(--border2);cursor:pointer;}
.itin-item:last-child{border-bottom:none;}
.itin-time{color:var(--muted);font-size:10px;width:34px;flex-shrink:0;padding-top:2px;}
.itin-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.itin-body{flex:1;min-width:0;}
.itin-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.itin-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.itin-add-row{display:flex;gap:6px;padding:8px 12px;background:var(--card2);}
.itin-add-btn{flex:1;background:var(--border2);color:var(--muted);font-size:11px;border-radius:8px;padding:7px;text-align:center;cursor:pointer;}
.itin-add-btn.primary{color:var(--amber);background:var(--amber-bg);}
.trip-tab-bar{display:flex;border-bottom:0.5px solid var(--border);flex-shrink:0;overflow-x:auto;}
.trip-tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.trip-tab.active{color:var(--amber);border-bottom:2px solid var(--amber);}
.expense-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:0.5px solid var(--border);}
.expense-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:0.5px solid var(--border);}
.check-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--muted2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;}
.check-box.on{background:var(--green);border-color:var(--green);color:#000;}
.member-card{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:0.5px solid var(--border);}
.member-av{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden;}
.member-av img{width:100%;height:100%;object-fit:cover;}
.perm-toggle{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer;}
.perm-edit{background:var(--green-bg);color:var(--green);}
.perm-view{background:var(--card2);color:var(--muted);}
.stat-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px 4px;}
.stat-c{background:var(--card);border-radius:10px;border:0.5px solid var(--border);padding:8px;text-align:center;}
.stat-cn{font-size:16px;font-weight:700;color:var(--amber);}
.stat-cl{font-size:10px;color:var(--muted);margin-top:2px;}
.curr-btn{background:var(--amber-bg);color:var(--amber);font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;border:0.5px solid var(--amber);}
.cat-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 10px;}
.cat-type{background:var(--card2);border:0.5px solid var(--border2);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;}
.cat-type.sel{border-color:var(--amber);background:var(--amber-bg);}
.cat-type-ico{font-size:20px;}
.cat-type-lbl{font-size:10px;color:var(--muted);margin-top:3px;}
.filter-tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;}
.filter-tabs::-webkit-scrollbar{display:none;}
.ftab{font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap;cursor:pointer;border:0.5px solid var(--border2);color:var(--muted);}
.ftab.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700;}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 24px;}
.pinkey{background:var(--card2);border-radius:14px;padding:18px;text-align:center;font-size:24px;color:var(--text);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.pinkey:active{opacity:0.4;transform:scale(0.94);}
.pinkey.del{background:var(--red-bg);color:var(--red);font-size:16px;}
.pindots{display:flex;gap:16px;justify-content:center;margin:20px 0 24px;}
.pindot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted2);}
.pindot.on{background:var(--amber);border-color:var(--amber);}
.secret-msg-row{display:flex;align-items:flex-end;gap:8px;padding:4px 16px;}
.secret-bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;background:var(--amber);color:#000;border-bottom-right-radius:4px;}
.secret-note{background:var(--card);border:0.5px solid var(--amber);border-radius:14px;padding:10px 14px;max-width:78%;}

.chat-list-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:0.5px solid var(--border);cursor:pointer;}
.chat-avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;position:relative;}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-unread{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chat-body{flex:1;min-width:0;}
.chat-name{font-size:15px;font-weight:600;}
.chat-preview{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-time{font-size:11px;color:var(--muted2);flex-shrink:0;}
.chat-room{display:flex;flex-direction:column;flex:1;overflow:hidden;}
.chat-messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 0;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;}
.chat-bubble-row{display:flex;align-items:flex-end;gap:8px;width:100%;padding:2px 12px;box-sizing:border-box;}
.chat-bubble-row.me{flex-direction:row-reverse;}
.chat-bubble{max-width:72%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}

async function compressImage(file) {
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1080; let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 修正國家 emoji：若為文字縮寫（如 TW/JP）則轉換為旗子 emoji
function fixCountryEmoji(c) {
  const emojiMap = {
    'TW':'🇹🇼','JP':'🇯🇵','KR':'🇰🇷','US':'🇺🇸','GB':'🇬🇧','FR':'🇫🇷',
    'IT':'🇮🇹','DE':'🇩🇪','TH':'🇹🇭','SG':'🇸🇬','AU':'🇦🇺','CN':'🇨🇳',
    'HK':'🇭🇰','MO':'🇲🇴','VN':'🇻🇳','MY':'🇲🇾','ID':'🇮🇩','PH':'🇵🇭',
    'IN':'🇮🇳','ES':'🇪🇸','PT':'🇵🇹','NL':'🇳🇱','CH':'🇨🇭','CA':'🇨🇦',
    'MX':'🇲🇽','BR':'🇧🇷','AR':'🇦🇷','NZ':'🇳🇿',
  };
  if(c.emoji && emojiMap[c.emoji.toUpperCase()]) {
    c.emoji = emojiMap[c.emoji.toUpperCase()];
  }
  return c;
}

async function loadUserData() {
  const uid = viewingUid || currentUser.uid;
  const d = await getDoc(doc(db,'userData',uid));
  if(d.exists()) {
    const data = d.data();
    countries = (data.countries || DEFAULT_COUNTRIES).map(fixCountryEmoji);
    shopCats = data.shopCats || DEFAULT_SHOPCATS;
    if(data.cats && data.cats.length) CATS = data.cats;
  } else {
    countries = DEFAULT_COUNTRIES;
    shopCats = DEFAULT_SHOPCATS;
    if(!viewingUid) await saveUserData();
  }
  // Load items with photos from subcollection
  const itemsSnap = await getDocs(collection(db,'userData',uid,'items'));
  items = await Promise.all(itemsSnap.docs.map(async d=>{
    const item = {id:d.id,...d.data()};
    if(item.photoCount>0) item.photos = await loadItemPhotos(uid,d.id,'items');
    else item.photos = item.photos||[];
    return item;
  }));
  const shopSnap = await getDocs(collection(db,'userData',uid,'shopItems'));
  shopItems = await Promise.all(shopSnap.docs.map(async d=>{
    const item = {id:d.id,...d.data()};
    if(item.photoCount>0) item.photos = await loadItemPhotos(uid,d.id,'shopItems');
    else item.photos = item.photos||[];
    return item;
  }));
  // Load friends
  if(!viewingUid) {
    friends = userProfile.friends || [];
  }
}

// Setup realtime listeners for own data
let ownListeners = [];
function setupOwnListeners() {
  ownListeners.forEach(u=>u()); ownListeners=[];
  const uid = currentUser.uid;
  
  // Listen to own items - 保留記憶體中的照片，不被 snapshot 蓋掉
  ownListeners.push(onSnapshot(collection(db,'userData',uid,'items'), snap=>{
    if(viewingUid) return;
    const existingPhotos = {};
    items.forEach(i=>{ if(i.photos&&i.photos.length) existingPhotos[i.id]=i.photos; });
    items = snap.docs.map(d=>{
      const item = {id:d.id,...d.data()};
      item.photos = existingPhotos[d.id] || item.photos || [];
      return item;
    });
    if(nav.page !== 'detail') render();
  }));
  
  // Listen to own shopItems
  ownListeners.push(onSnapshot(collection(db,'userData',uid,'shopItems'), snap=>{
    if(viewingUid) return;
    const existingPhotos = {};
    shopItems.forEach(i=>{ if(i.photos&&i.photos.length) existingPhotos[i.id]=i.photos; });
    shopItems = snap.docs.map(d=>{
      const item = {id:d.id,...d.data()};
      item.photos = existingPhotos[d.id] || item.photos || [];
      return item;
    });
    if(nav.page !== 'shopdetail') render();
  }));
  
  // Listen to own userData (countries, cats etc)
  ownListeners.push(onSnapshot(doc(db,'userData',uid), snap=>{
    if(viewingUid || !snap.exists()) return;
    const data = snap.data();
    countries = (data.countries || DEFAULT_COUNTRIES).map(fixCountryEmoji);
    shopCats = data.shopCats || DEFAULT_SHOPCATS;
    if(data.cats && data.cats.length) CATS = data.cats;
  }));
  
  // Listen to own profile (for friend code etc)
  ownListeners.push(onSnapshot(doc(db,'users',uid), snap=>{
    if(viewingUid || !snap.exists()) return;
    userProfile = snap.data();
    friends = userProfile.friends || [];
    // 重新監聽好友名字
    setupFriendProfileListeners();
    if(nav.page === 'friends') render();
  }));
}

// 即時監聽所有好友的名字/頭像
let friendProfileListeners = [];
function setupFriendProfileListeners() {
  friendProfileListeners.forEach(u=>u()); friendProfileListeners=[];
  friends.forEach(f=>{
    const unsub = onSnapshot(doc(db,'users',f.uid), snap=>{
      if(!snap.exists()) return;
      const data = snap.data();
      const fi = friends.findIndex(x=>x.uid===f.uid);
      if(fi>-1) {
        friends[fi].name = data.name || friends[fi].name;
        friends[fi].photo = data.photo || friends[fi].photo;
        // 同步更新 userProfile
        if(userProfile.friends) {
          userProfile.friends[fi] = friends[fi];
        }
      }
      if(nav.page === 'friends') render();
    });
    friendProfileListeners.push(unsub);
  });
}

  if(viewingUid) return;
  const {id, photos, ...data} = item;
  data.photoCount = (photos||[]).length; // 必須保留 photoCount！
  if(id && typeof id === 'string' && id.length > 5) {
    await setDoc(doc(db,'userData',currentUser.uid,'items',id), data);
  } else {
    const ref = await addDoc(collection(db,'userData',currentUser.uid,'items'), data);
    item.id = ref.id;

}

// 新增照片（只追加，不刪舊的）
async function appendPhotosToCol(uid, colName, itemId, newPhotos) {
  const col = collection(db,'userData',uid,colName,itemId,'photos');
  const existing = await getDocs(col);
  const startIdx = existing.size;
  await Promise.all(newPhotos.map((data, i) =>
    setDoc(doc(col, String(startIdx+i).padStart(6,'0')), {data, idx:startIdx+i, t:Date.now()})
  ));
}

async function deletePhotoFromCol(uid, colName, itemId, displayIdx) {
  const col = collection(db,'userData',uid,colName,itemId,'photos');
  const snap = await getDocs(col);
  const sorted = snap.docs.sort((a,b)=>a.data().idx-b.data().idx);
  if(sorted[displayIdx]) await deleteDoc(sorted[displayIdx].ref);
}

// 相容舊版（供 delPhoto 呼叫）
async function saveItemWithPhotos(item) { await saveItemMainDoc(item,'items'); }
async function saveShopItemWithPhotos(item) { await saveItemMainDoc(item,'shopItems'); }

async function loadItemPhotos(uid, itemId, colName) {
  const col = collection(db,'userData',uid,colName,itemId,'photos');
  const snap = await getDocs(col);
  if(snap.empty) return [];
  return snap.docs.sort((a,b)=>a.data().idx-b.data().idx).map(d=>d.data().data);
}

    'trippack': ['🧳 打包清單', ()=>{nav.page='tripdetail';render();}, '＋', ()=>openAddPackItem()],
    'tripshop': ['🛍️ 購買清單', ()=>{nav.page='tripdetail';render();}, '＋', ()=>openAddShopItem()],
    'tripmember': ['👥 同行人員', ()=>{nav.page='tripdetail';render();}, canEditTrip()&&isTripOwner()?'＋':null, ()=>openAddMember()],
    'admin': ['⚙️ 管理員', null, null, null],
    'profile': ['我的帳號', null, null, null],
  };

  const cfg = pages[nav.page];
  if(!cfg) return;

  let t = cfg[0];
  if(nav.page==='regions') { const c=countries.find(x=>x.id===nav.country); t=(c?c.emoji+' '+c.name:''); }
  if(nav.page==='cats') t='📍 '+nav.region;
  if(nav.page==='list') { const cat=CATS.find(c=>c.id===nav.cat); t=cat?cat.emoji+' '+cat.label:''; }
  if(nav.page==='shopcat') { const sc=shopCats.find(c=>c.id===nav.shopCat); t=sc?sc.emoji+' '+sc.label:''; }
  if(nav.page==='tripdetail') t=(currentTrip?.emoji||'✈️')+' '+(currentTrip?.title||'旅遊');

  if(isReadOnly() && ['countries','regions','cats','list','alllist','shop','shopcat','shopalllist'].includes(nav.page)) {
    const fp = friends.find(f=>f.uid===viewingUid);
    title.textContent = (fp?fp.name+'的':'朋友的')+' '+t;
  } else {
    title.textContent = t;
  }

  if(cfg[1]) { back.style.display='block'; back.onclick=cfg[1]; }
  if(cfg[2]) { action.textContent=cfg[2]; action.onclick=cfg[3]; }
}

async function renderPage() {
  const p = document.getElementById('pageContent');
  const pages = {
    'countries': renderCountries,
    'regions': renderRegions,
    'cats': renderCats,
    'list': renderList,
    'alllist': renderAllList,
    'detail': renderDetail,
    'shop': renderShop,
    'shopcat': renderShopCat,
    'shopalllist': renderShopAllList,
    'shopdetail': renderShopDetail,
    'friends': renderFriends,
    'chatlist': renderChatList,
    'chatroom': renderChatRoom,
    'secretchat': renderSecretChat,
    'triplist': renderTripList,
    'tripdetail': renderTripDetail,
    'tripitem': renderTripItem,
    'tripexpense': ()=>currentTrip?renderTripDetail():'',
    'trippack': ()=>currentTrip?renderTripDetail():'',
    'tripshop': ()=>currentTrip?renderTripDetail():'',
    'tripmember': ()=>currentTrip?renderTripDetail():'',
    'admin': renderAdmin,
    'profile': renderProfile,
  };
  const fn = pages[nav.page] || renderCountries;
  const result = fn();
  // 若是 async（renderAdmin），等待它完成
  if(result && typeof result.then === 'function') {
    await result;
  } else {
    p.innerHTML = result;
  }
  setTimeout(initSwipers, 50);
  if(nav.page==='chatroom' || nav.page==='secretchat') {
    document.getElementById('pageContent').classList.add('chat-page');
  } else {
    document.getElementById('pageContent').classList.remove('chat-page');
  }
  if(nav.page==='chatroom') {
    setTimeout(()=>{
      const msgs = document.getElementById('chatMessages');
      if(msgs) msgs.scrollTop = msgs.scrollHeight;
      const inp = document.getElementById('chatInput');
      if(inp) inp.focus();
    }, 100);
  }
}

function renderBottomNav() {
  const btns = [
    {ico:'🌏',lbl:'收藏',pages:['countries','regions','cats','list','alllist','detail']},
    {ico:'🛒',lbl:'網購',pages:['shop','shopcat','shopalllist','shopdetail']},
    {ico:'✈️',lbl:'旅遊',pages:['triplist','tripdetail','tripitem']},
    {ico:'👥',lbl:'好友',pages:['friends']},
    {ico:'💬',lbl:'訊息',pages:['chatlist','chatroom','secretchat']},
    {ico:'👤',lbl:'我的',pages:['profile']},
  ];
  if(isAdmin()) btns.push({ico:'⚙️',lbl:'管理',pages:['admin']});
  document.getElementById('bottomNav').innerHTML = btns.map(b=>{
    const active = b.pages.includes(nav.page);
    let badge = '';
    if(b.pages[0]==='friends' && incomingRequests.length>0) {
      badge = '<div style="position:absolute;top:2px;right:6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center">'+incomingRequests.length+'</div>';
    }
    if(b.pages[0]==='chatlist') {
      const unread = getTotalUnread();
      if(unread>0) badge = '<div style="position:absolute;top:2px;right:6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center">'+(unread>9?'9+':unread)+'</div>';
    }
    return '<div class="nav-btn'+(active?' active':'')+'" onclick="goNav(\''+b.pages[0]+'\')" style="position:relative">'+
      '<div class="nav-ico">'+b.ico+'</div>'+
      badge+
      '<div class="nav-lbl">'+b.lbl+'</div>'+
      '</div>';
  }).join('');
}

window.goNav = function(page) {
  if(['countries','regions','cats','list','alllist','detail'].includes(page)) {
    if(viewingUid) {
      // Going back to own data - clear friend listeners and reload own data
      clearFriendListeners();
      viewingUid = null;
      // 立即重置為自己的資料，避免短暫顯示朋友的資料
      countries = DEFAULT_COUNTRIES;
      items = [];
      shopItems = [];
      CATS = [{id:'eat',label:'好吃',emoji:'🍜',cls:'tag-eat'},{id:'play',label:'好玩',emoji:'🏞',cls:'tag-play'},{id:'buy',label:'好買',emoji:'🏪',cls:'tag-buy'},{id:'go',label:'想去',emoji:'📍',cls:'tag-go'}];
      nav={page:'countries',country:null,region:null,cat:null,filter:'all',shopCat:null,prevPage:null,itemId:null};
      document.getElementById('pageContent').innerHTML = '<div class="loading">載入中...</div>';
      loadUserData().then(()=>render());
      return;
    }
  }
  nav.page=page;
  render();
};

// ===== COUNTRIES =====
function renderCountries() {
  let h = '<div class="section-hdr">— 選擇國家 —</div>';
  if(!countries.length) return '<div class="empty">還沒有國家<br>'+(isReadOnly()?'':'按右上角開始新增！')+'</div>';
  countries.forEach(c=>{
    const cnt = items.filter(i=>i.country===c.id&&!i.done).length;
    h += `<div class="list-item" onclick="goRegions('${c.id}')">
      <div class="list-icon" style="background:#1a1a1a;font-size:28px">${c.emoji}</div>
      <div class="list-body"><div class="list-name">${c.name}</div><div class="list-sub">${cnt} 筆收藏</div></div>
      <div class="list-arrow">›</div></div>`;
  });
  return h;
}

function renderRegions() {
  const c = countries.find(x=>x.id===nav.country); if(!c) return '';
  const allCnt = items.filter(i=>i.country===c.id&&!i.done).length;
  let h = `<div class="list-item" style="background:var(--yellow-bg)" onclick="goAllList()">
    <div class="list-icon" style="background:var(--yellow-bg);font-size:22px">📋</div>
    <div class="list-body"><div class="list-name" style="color:var(--yellow)">${c.name}全部收藏</div>
    <div class="list-sub" style="color:var(--muted)">不分地區 · ${allCnt} 筆</div></div>
    <div class="list-arrow" style="color:var(--yellow)">›</div></div>`;
  h += '<div class="section-hdr">— 依地區 —</div>';
  (c.regions||[]).forEach(r=>{
    const cnt = items.filter(i=>i.country===c.id&&i.region===r&&!i.done).length;
    h += `<div class="list-item" onclick="goCats('${r}')">
      <div class="list-icon" style="background:var(--blue-bg);font-size:20px">📍</div>
      <div class="list-body"><div class="list-name">${r}</div><div class="list-sub">${cnt} 筆</div></div>
      <div class="list-arrow">›</div></div>`;
  });
  return h;
}

function renderCats() {
  return CATS.map(cat=>{
    const cnt = items.filter(i=>i.country===nav.country&&i.region===nav.region&&i.cat===cat.id&&!i.done).length;
    return `<div class="list-item" onclick="goList('${cat.id}')">
      <div class="list-icon" style="background:${getCatBg(cat.id)};font-size:22px">${cat.emoji}</div>
      <div class="list-body"><div class="list-name">${cat.label}</div><div class="list-sub">${cnt} 筆</div></div>
      <div class="list-arrow">›</div></div>`;
  }).join('');
}

function getCatBg(id){return{eat:'var(--amber-bg)',play:'var(--green-bg)',buy:'var(--purple-bg)',go:'var(--red-bg)'}[id]||'var(--card2)';}

function getFilteredItems() {
  let base = items.filter(i=>!i.done);
  if(nav.page==='list') base = items.filter(i=>i.country===nav.country&&i.region===nav.region&&i.cat===nav.cat&&!i.done);
  else if(nav.page==='alllist') {
    base = items.filter(i=>i.country===nav.country&&!i.done);
    if(nav.filter&&nav.filter!=='all') base = base.filter(i=>i.cat===nav.filter);
  }
  if(nav.search) {
    const q = nav.search.toLowerCase();
    base = base.filter(i=>i.name.toLowerCase().includes(q)||(i.note||'').toLowerCase().includes(q)||(i.address||'').toLowerCase().includes(q));
  }
  const sort = nav.sort||'stars';
  if(sort==='newest') return base.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(sort==='name') return base.sort((a,b)=>a.name.localeCompare(b.name,'zh-TW'));
  return base.sort((a,b)=>(b.stars||0)-(a.stars||0));
}

function renderListItem(item, from) {
  const cat = CATS.find(c=>c.id===item.cat)||CATS[0];
  const starsStr = '★'.repeat(item.stars||0);
  let sub = `<span class="stars" style="font-size:11px">${starsStr}</span>`;
  if(from==='alllist') sub += ` <span class="tag tag-loc">📍${item.region}</span><span class="tag ${cat.cls}">${cat.label}</span>`;
  if(item.note) sub += ` <span style="color:var(--muted);font-size:11px">${item.note.slice(0,15)}${item.note.length>15?'…':''}</span>`;
  const hasPhoto = item.photos&&item.photos.length;
  const thumb = hasPhoto?`background:var(--card2);`:`background:${getCatBg(item.cat)};`;
  const coverImg = hasPhoto ? item.photos[item.coverIdx||0]||item.photos[0] : null;
  const icon = coverImg?`<img src="${coverImg}" style="width:100%;height:100%;object-fit:cover;"/>`:cat.emoji;
  return `<div class="list-item" 
    onclick="goDetail('${item.id}','${from}')"
    ${!isReadOnly()?`ontouchstart="startLongPress('${item.id}',this,event)" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()"`:''}>
    <div class="list-icon" style="${thumb}font-size:22px">${icon}</div>
    <div class="list-body"><div class="list-name">${item.name}</div><div class="list-sub">${sub}</div></div>
    <div class="list-arrow">›</div></div>`;
}

function renderList() {
  const f = getFilteredItems();
  const sortBar = `<div class="sort-bar">
    <span class="sort-pill${(nav.sort||'stars')==='stars'?' active':''}" onclick="setSort('stars')">⭐ 星星</span>
    <span class="sort-pill${nav.sort==='newest'?' active':''}" onclick="setSort('newest')">🕐 最新</span>
    <span class="sort-pill${nav.sort==='name'?' active':''}" onclick="setSort('name')">🔤 名稱</span>
  </div>`;
  const searchBar = `<div class="search-bar"><input class="search-input" placeholder="🔍 搜尋名稱、備註..." value="${esc(nav.search||'')}" oninput="setSearch(this.value)"/></div>`;
  if(!f.length) return searchBar+sortBar+`<div class="empty">${nav.search?'找不到符合的收藏':'還沒有收藏'+(isReadOnly()?'':'<br>按右上角 ＋ 新增！')}</div>`;
  return searchBar+sortBar+`<div class="section-hdr">— 共 ${f.length} 筆 —</div>`+f.map(i=>renderListItem(i,'list')).join('');
}

function renderAllList() {
  nav.filter = nav.filter||'all';
  const f = getFilteredItems();
  const searchBar = `<div class="search-bar"><input class="search-input" placeholder="🔍 搜尋名稱、備註..." value="${esc(nav.search||'')}" oninput="setSearch(this.value)"/></div>`;
  let h = searchBar+'<div class="filter-bar">';
  h += `<div class="filter-pill${nav.filter==='all'?' active':''}" onclick="setFilter('all')">全部</div>`;
  CATS.forEach(cat=>{ h+=`<div class="filter-pill${nav.filter===cat.id?' active':''}" onclick="setFilter('${cat.id}')">${cat.emoji} ${cat.label}</div>`; });
  h += '</div>';
  h += `<div class="sort-bar">
    <span class="sort-pill${(nav.sort||'stars')==='stars'?' active':''}" onclick="setSort('stars')">⭐ 星星</span>
    <span class="sort-pill${nav.sort==='newest'?' active':''}" onclick="setSort('newest')">🕐 最新</span>
    <span class="sort-pill${nav.sort==='name'?' active':''}" onclick="setSort('name')">🔤 名稱</span>
  </div>`;
  if(!f.length) return h+(nav.search?'<div class="empty">找不到符合的收藏</div>':'<div class="empty">這個分類還沒有收藏</div>');
  h += `<div class="section-hdr">— 共 ${f.length} 筆 —</div>`;
  return h + f.map(i=>renderListItem(i,'alllist')).join('');
}

function renderHoursDisplay(hours) {
  if(!hours||!hours.length) return '';
  const groups = [];
  hours.forEach(h=>{
    const last = groups[groups.length-1];
    if(last && last.day===h.days) last.slots.push(h);
    else groups.push({day:h.days, slots:[h]});
  });
  return '<div class="hours-display">'+groups.map(g=>{
    const slotsHtml = g.slots.map(s=>{
      const timeStr = s.open&&s.close ? s.open+' – '+s.close : (s.note||'公休');
      const noteSpan = s.note&&s.open ? '<span class="hours-slot-note">'+esc(s.note)+'</span>' : '';
      return '<div class="hours-group-slot">'+timeStr+noteSpan+'</div>';
    }).join('');
    return '<div class="hours-group"><div class="hours-group-day">'+esc(g.day)+'</div><div class="hours-group-slots">'+slotsHtml+'</div></div>';
  }).join('')+'</div>';
}

function makeSlide(p, idx, itemId) {
  if(isVideo(p)) {
    return `<div class="photo-swiper-slide" data-open-idx="${idx}" data-open-id="${itemId}">
      <video src="${p}" playsinline muted loop autoplay style="width:100%;height:100%;object-fit:cover;pointer-events:none;"></video>
      <div class="media-type-badge">▶ 影片</div>
    </div>`;
  }
  return `<div class="photo-swiper-slide" data-open-idx="${idx}" data-open-id="${itemId}"><img src="${p}" style="pointer-events:none;"/></div>`;
}

function renderDetail() {
  const item = items.find(i=>i.id===nav.itemId); if(!item) return '<div class="empty">找不到</div>';
  const cat = CATS.find(c=>c.id===item.cat)||CATS[0];
  const c = countries.find(x=>x.id===item.country);
  const photos = item.photos||[];
  const slides = photos.length ? photos.map((p,i)=>makeSlide(p,i,item.id)).join('') :
    `<div class="photo-swiper-slide"><div class="slide-emoji">${cat.emoji}</div></div>`;
  const dots = photos.length>1 ? photos.map((_,i)=>`<div class="photo-dot${i===0?' on':''}" id="dot_${item.id}_${i}"></div>`).join('') : '';
  const count = photos.length>1 ? `<div class="photo-count">1 / ${photos.length}</div>` : '';
  let h = `<div class="photo-swiper" id="swiper_${item.id}" data-idx="0" data-count="${photos.length}" data-id="${item.id}" data-type="item">
    <div class="photo-swiper-track" id="track_${item.id}">${slides}</div>
    <div class="photo-swiper-overlay"></div>
    ${dots?'<div class="photo-dots">'+dots+'</div>':''}${count}
    ${!isReadOnly()?`<div class="photo-btn-row">
      <div class="photo-add-btn" onclick="addMediaType('${item.id}','item','image')">📷 ＋照片</div>
      
    </div>`:''}
    ${!isReadOnly()&&photos.length>1?`<div class="photo-cover-btn" id="coverBtn_${item.id}" onclick="setCover('${item.id}','item')">⭐ 設封面</div>`:''}
    ${!isReadOnly()&&photos.length?`<div class="photo-del-btn" onclick="delPhoto('${item.id}','item')">🗑 刪除此張</div>`:''}
  </div>`;
  const starClick = isReadOnly() ? '' : 'setItemStar';
  const starsHtml = [1,2,3,4,5].map(v=>{
    const on = v<=(item.stars||0) ? ' on' : '';
    const click = starClick ? 'onclick="'+starClick+'(\''+item.id+'\','+v+')"' : '';
    return '<span class="detail-star'+on+'" '+click+'>★</span>';
  }).join('');
  h += `<div class="detail-body">
    <div class="detail-tags">
      ${c?`<span class="tag" style="background:#1a1a1a;color:var(--muted)">${c.emoji} ${c.name}</span>`:''}
      <span class="tag tag-loc">📍 ${item.region}</span>
      <span class="tag ${cat.cls}">${cat.label}</span>
    </div>
    <div class="detail-name">${item.name}</div>
    <div class="detail-stars-row">${starsHtml}</div>
    ${item.note?`<div class="detail-section">備註</div><div class="detail-val">${item.note}</div>`:''}
    ${item.hours&&item.hours.length?`<div class="detail-section">🕐 營業時間</div>`+renderHoursDisplay(item.hours):''}
    ${item.address?`<div class="detail-section">地址</div><div class="detail-val">${item.address}</div>`:''}
    ${item.phone?`<div class="detail-section">電話</div><div class="detail-val"><a href="tel:${esc(item.phone)}" style="color:var(--green);text-decoration:none">📞 ${esc(item.phone)}</a></div>`:''}
    ${item.link?`<div class="detail-section">連結</div><div class="detail-link" onclick="openLink('${item.link}')">${item.link}</div>`:''}
    <div class="detail-btns">
      ${item.address?`<div class="detail-btn btn-nav" onclick="openMap('${item.address}')">🧭 導航</div>`:''}
      ${item.phone?`<div class="detail-btn" style="background:var(--green-bg);color:var(--green)" onclick="window.location='tel:${esc(item.phone)}'">📞 致電</div>`:''}
      ${item.link?`<div class="detail-btn btn-link" onclick="openLink('${item.link}')">🔗 連結</div>`:''}
      <div class="detail-btn" style="background:var(--blue-bg);color:var(--blue)" onclick="shareItem('${item.id}')">📤 分享</div>
      ${isReadOnly()?`<div class="detail-btn" style="background:var(--green-bg);color:var(--green)" onclick="copyFromFriend('${item.id}')">➕ 複製到我的</div>`:''}
      ${!isReadOnly()?`<div class="detail-btn btn-edit" onclick="openEditItem('${item.id}')">✏️ 編輯</div>`:''}
      ${!isReadOnly()?`<div class="detail-btn btn-del" onclick="deleteItem('${item.id}')">🗑 刪除</div>`:''}
    </div>
  </div>`;
  return h;
}

function shopListItem(item) {
  const sc = shopCats.find(c=>c.id===item.shopCat);

  const thumb = hasPhoto?'background:var(--card2);':'background:var(--blue-bg);';

function renderShopCat() {

function renderShopAllList() {
  const f = shopItems.filter(i=>!i.done);
  if(!f.length) return '<div class="empty">網購清單是空的</div>';
  return `<div class="section-hdr">— 全部 ${f.length} 筆 —</div>`+f.map(shopListItem).join('');

function renderShopDetail() {

    ${!isReadOnly()&&photos.length?`<div class="photo-del-btn" onclick="delPhoto('${item.id}','shop')">🗑 刪除此張</div>`:''}
  </div>`;

    return '<span class="detail-star'+on+'" '+click+'>★</span>';
  }).join('');
  h += `<div class="detail-body">
    <div class="detail-tags"><span class="tag tag-shop">🛒 網購</span>${sc?`<span class="tag" style="background:var(--blue-bg);color:var(--blue)">${sc.emoji} ${sc.label}</span>`:''}</div>
    <div class="detail-name">${item.name}</div>
    <div class="detail-stars-row">${starsHtml}</div>
    ${item.note?`<div class="detail-section">備註</div><div class="detail-val">${item.note}</div>`:''}
    ${item.link?`<div class="detail-section">連結</div><div class="detail-link" onclick="openLink('${item.link}')">${item.link}</div>`:''}
    <div class="detail-btns">
      ${item.link?`<div class="detail-btn btn-link" onclick="openLink('${item.link}')">🔗 連結</div>`:''}
      ${!isReadOnly()?`<div class="detail-btn btn-edit" onclick="openEditShop('${item.id}')">✏️ 編輯</div>`:''}
      ${!isReadOnly()?`<div class="detail-btn btn-done" onclick="markShopDone('${item.id}')">✓ 完成</div>`:''}
      ${!isReadOnly()?`<div class="detail-btn btn-del" onclick="deleteShopItem('${item.id}')">🗑 刪除</div>`:''}
    </div>
  </div>`;

}

window.doAddFriend = async function() {
  const code = document.getElementById('mFriendCode').value.trim().toUpperCase();
  if(!code || code.length<4) { alert('請輸入正確的好友代碼'); return; }
  try {
    const q = query(collection(db,'users'), where('friendCode','==',code));
    const snap = await getDocs(q);
    if(snap.empty) { alert('找不到這個好友代碼'); return; }
    const friendData = snap.docs[0].data();
    if(friendData.uid === currentUser.uid) { alert('不能加自己為好友 😅'); return; }
    if(friends.find(f=>f.uid===friendData.uid)) { alert('這個人已經是你的好友了！'); return; }

    // 檢查是否已送過邀請
    const existing = query(collection(db,'friendRequests'),
      where('from','==',currentUser.uid), where('to','==',friendData.uid), where('status','==','pending'));
    const existingSnap = await getDocs(existing);
    if(!existingSnap.empty) { alert('已送出邀請，等待對方確認中！'); closeModal(); return; }

    // 送出好友邀請
    await addDoc(collection(db,'friendRequests'), {
      from: currentUser.uid,
      to: friendData.uid,
      fromName: userProfile.name || currentUser.displayName || '用戶',
      fromPhoto: userProfile.photo || currentUser.photoURL || '',
      fromEmail: currentUser.email || '',
      status: 'pending',
      t: Date.now()
    });

    closeModal();
    alert(`✅ 已送出好友邀請給 ${friendData.name}，等待對方確認！`);
  } catch(e) { alert('送出失敗：'+e.message); }
};

window.acceptFriendRequest = async function(reqId) {
  const req = incomingRequests.find(r=>r.id===reqId);
  if(!req) return;
  try {
    // 雙方互加好友
    const newFriend = {uid:req.from, name:req.fromName, email:req.fromEmail||'', photo:req.fromPhoto||''};
    friends.push(newFriend);
    userProfile.friends = friends;
    await setDoc(doc(db,'users',currentUser.uid), userProfile);

    // 對方也加我為好友
    const theirDoc = await getDoc(doc(db,'users',req.from));
    if(theirDoc.exists()) {
      const theirData = theirDoc.data();
      const theirFriends = theirData.friends||[];
      if(!theirFriends.find(f=>f.uid===currentUser.uid)) {
        theirFriends.push({uid:currentUser.uid, name:userProfile.name, email:currentUser.email||'', photo:userProfile.photo||''});
        await setDoc(doc(db,'users',req.from), {...theirData, friends:theirFriends});
      }
    }

    // 更新邀請狀態
    await setDoc(doc(db,'friendRequests',reqId), {status:'accepted'}, {merge:true});

    setupChatListeners();
    render();
    alert(`✅ 已確認好友：${req.fromName}`);
  } catch(e) { alert('確認失敗：'+e.message); }
};

window.declineFriendRequest = async function(reqId) {
  if(!confirm('確定拒絕這個好友邀請？')) return;
  await setDoc(doc(db,'friendRequests',reqId), {status:'declined'}, {merge:true});
};

let friendListeners = []; // store unsubscribe functions

window.viewFriend = async function(uid) {
  viewingUid = uid;
  clearFriendListeners();
  document.getElementById('pageContent').innerHTML = '<div class="loading">載入中...</div>';
  
  // Load friend profile (realtime)
  const profileUnsub = onSnapshot(doc(db,'users',uid), (snap) => {
    if(snap.exists()) {
      const data = snap.data();
      // Update friend name in our list
      const fi = friends.findIndex(f=>f.uid===uid);
      if(fi>-1) { friends[fi].name=data.name; friends[fi].photo=data.photo||''; }
    }
  });
  friendListeners.push(profileUnsub);

  // Load friend userData (realtime)
  const dataUnsub = onSnapshot(doc(db,'userData',uid), (snap) => {
    if(snap.exists()) {
      const data = snap.data();
      countries = (data.countries || DEFAULT_COUNTRIES).map(fixCountryEmoji);
      shopCats = data.shopCats || DEFAULT_SHOPCATS;
      if(data.cats && data.cats.length) CATS = data.cats;
    }
    if(nav.page !== 'detail' && nav.page !== 'shopdetail') render();
  });
  friendListeners.push(dataUnsub);

  // Load friend items (realtime)
  const itemsUnsub = onSnapshot(collection(db,'userData',uid,'items'), async (snap) => {
    const existingPhotos = {};
    items.forEach(i=>{ if(i.photos&&i.photos.length) existingPhotos[i.id]=i.photos; });
    items = await Promise.all(snap.docs.map(async d=>{
      const item = {id:d.id,...d.data()};
      if(existingPhotos[d.id]) {
        item.photos = existingPhotos[d.id];
      } else if(item.photoCount > 0) {
        item.photos = await loadItemPhotos(uid, d.id, 'items');
      } else {
        item.photos = [];
      }
      return item;
    }));
    if(nav.page !== 'detail' && nav.page !== 'shopdetail') render();
  });
  friendListeners.push(itemsUnsub);

  // Load friend shopItems (realtime)
  const shopUnsub = onSnapshot(collection(db,'userData',uid,'shopItems'), (snap) => {
    shopItems = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(nav.page !== 'detail' && nav.page !== 'shopdetail') render();
  });
  friendListeners.push(shopUnsub);

  nav.page = 'countries';
  render();
};

// ===== 隱藏聊天室 =====
// 概念：隱藏特定好友的聊天，不顯示在正常訊息頁
let secretUnlocked = false;
let secretPinInput = '';
let secretMode = 'unlock'; // 'setup' | 'unlock' | 'confirm'
let secretPinTemp = '';

function getSecretPin() { return userProfile?.secretPin||null; }
function hashPin(pin) {
  let h = 0;
  for(let i=0;i<pin.length;i++) h = (h*31+pin.charCodeAt(i))&0xffffffff;
  return h.toString(36)+'_'+pin.length;
}
function getHiddenUids() { return userProfile?.hiddenChats||[]; }
function isHidden(uid) { return getHiddenUids().includes(uid); }

async function saveHiddenChats(uids) {
  userProfile.hiddenChats = uids;
  await setDoc(doc(db,'users',currentUser.uid), userProfile);
}

window.hideChat = async function(uid) {
  const uids = [...getHiddenUids()];
  if(!uids.includes(uid)) uids.push(uid);
  await saveHiddenChats(uids);
  render();
};

window.unhideChat = async function(uid) {
  const uids = getHiddenUids().filter(u=>u!==uid);
  await saveHiddenChats(uids);
  if(nav.page==='secretchat') renderPage();
};

window.openSecretChat = function() {
  secretPinInput = '';
  secretMode = getSecretPin() ? 'unlock' : 'setup';
  secretPinTemp = '';
  nav.page = 'secretchat';
  render();
  document.getElementById('headerTitle').textContent = '🔐';
  document.getElementById('headerBack').style.display='block';
  document.getElementById('headerBack').onclick = closeSecretChat;
};

window.closeSecretChat = function() {
  secretUnlocked = false;
  nav.page='chatlist';
  render();
};

window.secretPinPress = function(val) {
  if(secretPinInput.length>=4) return;
  secretPinInput += val;
  updatePinDots();
  if(secretPinInput.length===4) setTimeout(()=>processPin(), 150);
};
window.secretPinDel = function() {
  secretPinInput = secretPinInput.slice(0,-1);
  updatePinDots();
};
function updatePinDots() {
  document.querySelectorAll('.pindot').forEach((d,i)=>d.classList.toggle('on',i<secretPinInput.length));
}

async function processPin() {
  if(secretMode==='setup') {
    secretPinTemp = secretPinInput; secretPinInput='';
    secretMode='confirm'; renderPage();
    document.getElementById('headerTitle').textContent='🔐';
    return;
  }
  if(secretMode==='confirm') {
    if(secretPinInput!==secretPinTemp) {
      secretPinInput=''; secretPinTemp=''; secretMode='setup'; renderPage();
      setTimeout(()=>{ const el=document.querySelector('.pin-error'); if(el){el.textContent='兩次密碼不一致，請重新設定';el.style.display='block';} },50);
      return;
    }
    userProfile.secretPin = hashPin(secretPinInput);
    await setDoc(doc(db,'users',currentUser.uid),userProfile);
    secretUnlocked=true; secretPinInput=''; renderPage(); return;
  }
  if(secretMode==='unlock') {
    if(hashPin(secretPinInput)===getSecretPin()) {
      secretUnlocked=true; secretPinInput=''; renderPage();
    } else {
      secretPinInput=''; updatePinDots();
      const el=document.querySelector('.pin-error');
      if(el){el.style.display='block';setTimeout(()=>{if(el)el.style.display='none';},1500);}
    }
  }
}

async function tryFaceId() {
  try {
    if(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) {
      await navigator.credentials.get({publicKey:{challenge:new Uint8Array(32),timeout:60000,userVerification:'required'}});
      secretUnlocked=true; renderPage(); return;
    }
  } catch(e) {}
  alert('Face ID 不可用，請輸入密碼');
}

  h += '<div class="pin-error" style="display:none;color:var(--red);font-size:12px;margin-bottom:4px;">密碼錯誤，請再試一次</div>';
  h += '</div>';
  h += '<div class="pinpad">';
  [1,2,3,4,5,6,7,8,9].forEach(n=>{

  h += '<div class="pinkey del" ontouchstart="event.preventDefault();secretPinDel()" onclick="secretPinDel()">⌫</div>';
  h += '</div>';
  return h;

function renderSecretChat() {
  if(!secretUnlocked) {
    if(secretMode==='setup') return renderPinPad('設定 4 位數密碼','設定後每次進入都需要輸入');
    if(secretMode==='confirm') return renderPinPad('再次輸入確認','');
    return renderPinPad('輸入密碼','');
  }

  // 已解鎖：顯示隱藏的好友聊天列表
  const hiddenUids = getHiddenUids();
  const hiddenFriends = friends.filter(f=>hiddenUids.includes(f.uid));

  let h = '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;">';
  h += '<div style="font-size:12px;color:var(--muted)">隱藏的對話</div>';
  h += '<div style="font-size:12px;color:var(--amber);cursor:pointer" onclick="openHideSettings()">⚙️ 管理隱藏</div>';
  h += '</div>';

  if(!hiddenFriends.length) {
    h += '<div class="empty" style="padding:30px">還沒有隱藏任何對話<br><br>';
    h += '<div style="font-size:12px;color:var(--muted2)">在訊息頁長按好友<br>可選擇隱藏對話</div></div>';
    return h;
  }

  hiddenFriends.forEach(f=>{
    const chatId = getChatId(currentUser.uid, f.uid);
    const msgs = chatMessages[chatId]||[];
    const last = msgs[msgs.length-1];
    const unread = chatUnread[chatId]||0;
    let preview = '點擊開始聊天';
    if(last) {
      if(last.recalled) preview='訊息已收回';
      else if(last.deletedBy&&last.deletedBy.includes(currentUser.uid)) preview='訊息已刪除';
      else if(last.img) preview='📷 圖片';
      else if(last.video) preview='🎥 影片';
      else preview=last.text||'';
    }
    const timeStr = last?formatChatTime(last.t):'';
    h += '<div class="chat-list-item" style="position:relative;">';
    h += '<div onclick="openChat(\'' +f.uid+ '\')" style="display:flex;align-items:center;gap:12px;flex:1;">';
    h += '<div class="chat-avatar" style="position:relative">';
    h += (f.photo?'<img src="'+f.photo+'"/>':(f.name?.[0]||'👤'));
    if(unread>0) h += '<div class="chat-unread">'+(unread>9?'9+':unread)+'</div>';
    h += '</div>';
    h += '<div class="chat-body"><div class="chat-name">'+esc(getFriendDisplayName(f))+'</div>';
    h += '<div class="chat-preview">'+esc(preview.slice(0,30))+'</div></div>';
    if(timeStr) h += '<div class="chat-time">'+timeStr+'</div>';
    h += '</div>';
    h += '<div onclick="unhideChat(\'+f.uid+\'" style="padding:8px 12px;color:var(--muted2);font-size:18px;cursor:pointer;">👁</div>';
    h += '</div>';
  });
  return h;
}

let chatListeners = {};
let chatMessages = {};
let chatUnread = {};
let currentChatUid = null;

function getChatId(uid1, uid2) {
  return [uid1, uid2].sort().join('_');
}

function getTotalUnread() {
  return Object.values(chatUnread).reduce((a,b)=>a+b, 0);
}

function setupChatListeners() {
  friends.forEach(f => {
    const chatId = getChatId(currentUser.uid, f.uid);
    if(chatListeners[chatId]) return;
    const col = collection(db, 'chats', chatId, 'messages');
    // 只載入最近 50 則，避免載太多
    const q2 = query(col, orderBy('t', 'desc'), limit(50));
    chatListeners[chatId] = onSnapshot(q2, snap => {
      const msgs = snap.docs.map(d=>({id:d.id,...d.data()})).reverse();
      chatMessages[chatId] = msgs;
      chatUnread[chatId] = msgs.filter(m=>m.from!==currentUser.uid&&!m.readBy?.[currentUser.uid]).length;
      if(nav.page==='chatlist') renderPage();
      else if(nav.page==='chatroom' && currentChatUid===f.uid) {
        renderPage();
        markChatRead(chatId);
        // 自動滾到底部
        setTimeout(()=>{ const el=document.getElementById('chatMessages'); if(el) el.scrollTop=el.scrollHeight; },50);
      } else {
        renderBottomNav();
      }
    });
  });
}

async function markChatRead(chatId) {
  const msgs = chatMessages[chatId]||[];
  const unread = msgs.filter(m=>m.from!==currentUser.uid&&!m.readBy?.[currentUser.uid]);
  if(!unread.length) return;
  await Promise.all(unread.map(m=>
    setDoc(doc(db,'chats',chatId,'messages',m.id), {readBy:{[currentUser.uid]:Date.now()}}, {merge:true})
  ));
  chatUnread[chatId] = 0;
}

function renderChatList() {
  setTimeout(setupDoubleTap, 50);
  const visibleFriends = friends.filter(f=>!isHidden(f.uid));
  if(!visibleFriends.length && !friends.length) return '<div class="empty">還沒有好友<br>去「好友」頁面新增好友！</div>';
  if(!visibleFriends.length) return '<div class="empty" style="padding:40px">所有對話都已隱藏</div>';
  let h = '';
  visibleFriends.forEach(f => {
    const chatId = getChatId(currentUser.uid, f.uid);
    const msgs = chatMessages[chatId]||[];
    const last = msgs[msgs.length-1];
    const unread = chatUnread[chatId]||0;
    let preview = '點擊開始聊天';
    if(last) {
      if(last.recalled) preview = '訊息已收回';
      else if(last.deletedBy && last.deletedBy.includes(currentUser.uid)) {
        // 自己刪的，找上一則
        const visible = msgs.filter(m=>!(m.deletedBy&&m.deletedBy.includes(currentUser.uid)));
        const prev = visible[visible.length-1];
        preview = prev ? (prev.recalled?'訊息已收回':prev.img?'📷 圖片':prev.video?'🎥 影片':prev.text||'') : '點擊開始聊天';
      }
      else if(last.img) preview = '📷 圖片';
      else if(last.video) preview = '🎥 影片';
      else preview = last.text||'';
    }
    const timeStr = last ? formatChatTime(last.t) : '';
    h += '<div class="chat-list-item" onclick="openChat(\''+f.uid+'\')" ontouchstart="startChatLongPress(\''+f.uid+'\',this)" ontouchend="cancelChatLongPress()" ontouchmove="cancelChatLongPress()">';
    h += '<div class="chat-avatar" style="position:relative">';
    h += (f.photo?'<img src="'+f.photo+'"/>':(f.name?.[0]||'👤'));
    if(unread>0) h += '<div class="chat-unread">'+(unread>9?'9+':unread)+'</div>';
    h += '</div><div class="chat-body">';
    h += '<div class="chat-name">'+esc(getFriendDisplayName(f))+'</div>';
    h += '<div class="chat-preview" style="'+(unread>0?'color:var(--text);font-weight:600':'')+'"">'+esc(preview.slice(0,30))+'</div>';
    h += '</div>';
    if(timeStr) h += '<div class="chat-time">'+timeStr+'</div>';
    h += '</div>';
  });
  return h;
}

function formatChatTime(ts) {
  if(!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if(diff < 60000) return '剛剛';
  if(diff < 3600000) return Math.floor(diff/60000)+'分前';
  if(diff < 86400000) return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function renderChatRoom() {
  const f = friends.find(x=>x.uid===currentChatUid);
  if(!f) return '<div class="empty">找不到對話</div>';
  const chatId = getChatId(currentUser.uid, f.uid);

  const bubblesHtml = msgs.map(m => {
    const isMe = m.from === currentUser.uid;
    const time = formatChatTime(m.t);

    // 只有自己刪除的 → 自己看不到，直接跳過
    if(m.deletedBy && m.deletedBy.includes(currentUser.uid)) return '';

    // 收回訊息 → 雙方都看到「訊息已收回」
    if(m.recalled) {
      return `<div class="chat-bubble-row ${isMe?'me':'them'}">
        ${!isMe?`<div class="chat-avatar" style="width:32px;height:32px;font-size:14px;flex-shrink:0">${f.photo?`<img src="${f.photo}"/>`:'👤'}</div>`:''}
        <div>

          <div class="chat-meta ${isMe?'me':''}"><span>${time}</span></div>
        </div>
      </div>`;
    }

    let content = '';
    if(m.text) content += `<div>${esc(m.text)}</div>`;
    if(m.img) content += `<img src="${m.img}" onclick="openChatMedia('${m.id}','img')" style="max-width:200px;max-height:200px;border-radius:10px;display:block;margin-top:${m.text?'6':'0'}px;cursor:pointer"/>`;
    if(m.video) content += `<video src="${m.video}" style="max-width:200px;max-height:200px;border-radius:10px;display:block;margin-top:${m.text?'6':'0'}px" controls playsinline></video>`;

    const readMark = isMe
      ? (m.readBy && Object.keys(m.readBy).some(k=>k!==currentUser.uid) ? '✓✓' : '✓')
      : '';

    const longPressAttr = `ontouchstart="startMsgLongPress('${m.id}','${isMe}',this)" ontouchend="cancelMsgLongPress()" ontouchmove="cancelMsgLongPress()"`;

    return `<div class="chat-bubble-row ${isMe?'me':'them'}">
      ${!isMe?`<div class="chat-avatar" style="width:32px;height:32px;font-size:14px;flex-shrink:0">${f.photo?`<img src="${f.photo}"/>`:'👤'}</div>`:''}
      <div ${longPressAttr}>

        <div class="chat-meta ${isMe?'me':''}">
          <span>${time}</span>
          ${isMe?`<span class="chat-read">${readMark}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  const emptyMsg = `<div style="text-align:center;color:var(--muted);font-size:13px;padding:40px 0">開始和 ${esc(f.name)} 聊天吧！</div>`;

  return `<div class="chat-room">
    <div class="chat-messages" id="chatMessages">${bubblesHtml||emptyMsg}</div>
    <div class="chat-input-bar">
      <button class="chat-media-btn" onclick="sendChatMedia()">📷</button>
            <textarea class="chat-input" id="chatInput" placeholder="輸入訊息..." rows="1"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg();}"></textarea>
      <button class="chat-send-btn" onclick="sendChatMsg()">➤</button>
    </div>
  </div>`;
}

window.saveChatMedia = async function(src, type) {
  try {
    // 轉成 blob
    const res = await fetch(src);
    const blob = await res.blob();
    const fileName = type==='video' ? 'video.mp4' : 'photo.jpg';
    const file = new File([blob], fileName, {type: blob.type});

    if(navigator.canShare && navigator.canShare({files:[file]})) {
      // iOS/Android：用分享選單，可以選「儲存到照片」
      await navigator.share({files:[file], title:fileName});
    } else {
      // 桌面：直接下載
      const a = document.createElement('a');
      a.href = src;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  } catch(e) {
    if(e.name !== 'AbortError') alert('儲存失敗，請長按照片後選擇儲存');
  }
};

window.shareChatMedia = function(src, type) {
  if(navigator.share) {
    fetch(src).then(r=>r.blob()).then(blob=>{
      const file = new File([blob], type==='video'?'video.mp4':'photo.jpg', {type: blob.type});
      navigator.share({files:[file]}).catch(()=>{});
    }).catch(()=>{ navigator.share({text:'分享媒體'}).catch(()=>{}); });
  } else {
    saveChatMedia(src, type);
  }
};

    const updated = {id:snap.id,...snap.data()};
    const idx = trips.findIndex(t=>t.id===tripId);
    if(idx>-1) trips[idx]=updated; else trips.push(updated);
    if(currentTrip?.id===tripId) currentTrip=updated;
    if(['tripdetail','tripitem'].includes(nav.page)) renderPage();
  });
}

// ===== 旅遊清單頁 =====
function renderTripList() {
  let h = '';
  if(!trips.length) return '<div class="empty">還沒有旅遊計畫<br>按右上角 ＋ 新增！</div>';
  trips.forEach(t=>{
    const days = t.days||1;
    const isOwner = t.ownerId===currentUser.uid;
    const isPublic = t.isPublic===true;
    const statusTag = t.status==='done'?'<span class="tag tag-play">已完成</span>':'<span class="tag tag-eat">規劃中</span>';
    const privTag = isPublic
      ? '<span class="tag" style="background:var(--green-bg);color:var(--green)">🌐 公開</span>'
      : '<span class="tag" style="background:var(--card2);color:var(--muted2)">🔒 不公開</span>';
    h += '<div class="trip-card" onclick="openTrip(\''+t.id+'\')">';
    h += '<div class="trip-cover" style="background:'+getCoverGradient(t.emoji)+'">'+
         '<div class="trip-cover-grad"></div>'+
         '<div class="trip-cover-emoji">'+t.emoji+'</div>'+
         '<div class="trip-info"><div class="trip-name">'+esc(t.title)+'</div></div>';
    if(isOwner) {
      h += '<div onclick="event.stopPropagation();toggleTripPublic(\''+t.id+'\')" style="position:absolute;top:8px;left:10px;background:rgba(0,0,0,0.5);border-radius:8px;padding:3px 8px;font-size:10px;color:'+(isPublic?'#30D158':'#aaa')+';">'+(isPublic?'🌐 公開':'🔒 不公開')+'</div>';
    }
    h += '</div>';
    h += '<div class="trip-body"><div class="trip-meta-row">'+statusTag+'<span class="tag tag-loc">'+days+'天</span>';
    if(t.startDate) h += '<span style="font-size:10px;color:var(--muted)">'+t.startDate+'</span>';
    h += '</div></div></div>';
  });
  return h;
}

window.toggleTripPublic = async function(id) {
  const t = trips.find(x=>x.id===id); if(!t) return;
  if(t.ownerId!==currentUser.uid) return;
  const newVal = !t.isPublic;
  await updateDoc(getTripDoc(id), {isPublic: newVal});
  t.isPublic = newVal;
  if(currentTrip?.id===id) currentTrip.isPublic = newVal;
  render();
};

function getCoverGradient(emoji) {
  const map={'🇯🇵':'linear-gradient(135deg,#1a2a1a,#0d3b2a)','🇰🇷':'linear-gradient(135deg,#1a1a2a,#0d1a3b)','🇺🇸':'linear-gradient(135deg,#1a0a0a,#2a0d0d)','🇹🇼':'linear-gradient(135deg,#1a1a1a,#0d0d2a)','🇹🇭':'linear-gradient(135deg,#1a2a1a,#2a1a0a)'};
  return map[emoji]||'linear-gradient(135deg,#1a1a2a,#0d1a3b)';
}

window.openTrip = async function(id) {
  currentTrip = trips.find(t=>t.id===id);
  if(!currentTrip) return;
  setupTripListener(id);
  nav.page='tripdetail'; nav.tripTab='itinerary'; nav.tripId=id;
  render();
  document.getElementById('headerTitle').textContent = currentTrip.title;
};

// ===== 旅遊詳細頁（行程）=====
function renderTripDetail() {
  if(!currentTrip) return '<div class="empty">找不到旅遊計畫</div>';
  const tab = nav.tripTab||'itinerary';
  const tabs = [
    {id:'itinerary',lbl:'📅 行程'},
    {id:'expense',lbl:'💰 開銷'},
    {id:'pack',lbl:'🧳 打包'},
    {id:'shoplist',lbl:'🛍️ 購買'},
    {id:'member',lbl:'👥 成員'},
  ];
  let h = '<div class="trip-tab-bar">';
  tabs.forEach(t=>{ h+='<div class="trip-tab'+(tab===t.id?' active':'')+'" onclick="setTripTab(\''+t.id+'\')">'+t.lbl+'</div>'; });
  h += '</div>';
  if(tab==='itinerary') h += renderItinerary();
  else if(tab==='expense') h += renderExpenseTab();
  else if(tab==='pack') h += renderPackTab();
  else if(tab==='shoplist') h += renderShopTab();
  else if(tab==='member') h += renderMemberTab();
  return h;
}

window.setTripTab = function(tab) {
  nav.tripTab=tab; renderPage();
};

function renderItinerary() {
  const items = currentTrip.itinerary||[];
  const days = currentTrip.days||1;
  let h = '';
  for(let d=1;d<=days;d++) {
    const dayItems = items.filter(i=>i.day===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    h += '<div class="day-block">';
    h += '<div class="day-hdr"><span class="day-num-badge">Day '+d+'</span>';
    if(currentTrip.startDate) {
      const dt = new Date(currentTrip.startDate);
      dt.setDate(dt.getDate()+d-1);
      h += '<span class="day-date-txt">'+getDayStr(dt)+'</span>';
    }
    h += '</div>';
    if(dayItems.length) {
      dayItems.forEach(item=>{
        const cat = TRIP_CATS.find(c=>c.id===item.type)||TRIP_CATS[7];
        h += '<div class="itin-item" onclick="openTripItem(\''+item.id+'\')">';
        h += '<div class="itin-time">'+(item.time||'')+'</div>';
        h += '<div class="itin-dot" style="background:'+cat.color+'"></div>';
        h += '<div class="itin-body"><div class="itin-name">'+esc(item.name)+'</div>';
        if(item.address||item.note) h += '<div class="itin-sub">'+esc((item.address||item.note||'').slice(0,30))+'</div>';
        h += '</div>';
        if(item.photos&&item.photos.length) h += '<div style="font-size:16px">📷</div>';
        h += '</div>';
      });
    } else {
      h += '<div style="padding:12px;text-align:center;color:var(--muted2);font-size:12px;">尚無行程</div>';
    }
    if(canEditTrip()) {
      h += '<div class="itin-add-row">';
      h += '<div class="itin-add-btn primary" onclick="openAddItinItemDay('+d+')">＋ 新增行程</div>';
      h += '<div class="itin-add-btn" onclick="openFromCollection('+d+')">🔁 從收藏加入</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  return h;
}

function getDayStr(dt) {
  const days=['日','一','二','三','四','五','六'];
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日（'+days[dt.getDay()]+'）';
}

// ===== 旅遊行程詳細頁 =====
function renderTripItem() {
  const item = (currentTrip?.itinerary||[]).find(i=>i.id===nav.tripItemId);
  if(!item) return '<div class="empty">找不到行程</div>';
  const cat = TRIP_CATS.find(c=>c.id===item.type)||TRIP_CATS[7];
  const photos = item.photos||[];
  const slides = photos.length ? photos.map((p,i)=>makeSlide(p,i,'trip_'+item.id)).join('') :
    '<div class="photo-swiper-slide"><div class="slide-emoji">'+cat.emoji+'</div></div>';
  let h = '<div class="photo-swiper" id="swiper_trip_'+item.id+'" data-idx="0" data-count="'+photos.length+'" data-id="trip_'+item.id+'" data-type="trip">';
  h += '<div class="photo-swiper-track" id="track_trip_'+item.id+'">'+slides+'</div>';
  h += '<div class="photo-swiper-overlay"></div>';
  if(photos.length>1) h += '<div class="photo-dots">'+photos.map((_,i)=>'<div class="photo-dot'+(i===0?' on':'')+'"></div>').join('')+'</div>';
  if(photos.length>1) h += '<div class="photo-count">1 / '+photos.length+'</div>';
  if(canEditTrip()) {
    h += '<div class="photo-btn-row"><div class="photo-add-btn" onclick="addTripItemPhoto(\''+item.id+'\')">📷 ＋照片</div></div>';
    if(photos.length) h += '<div class="photo-del-btn" onclick="delTripItemPhoto(\''+item.id+'\')">🗑 刪除此張</div>';
  }
  h += '</div>';
  h += '<div class="detail-body">';
  h += '<div style="font-size:12px;color:var(--amber);font-weight:600;margin-bottom:4px;">Day '+item.day+(item.time?' · '+item.time:'')+'</div>';
  h += '<div class="detail-name">'+esc(item.name)+'</div>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px"><span class="tag" style="background:'+cat.bg+';color:'+cat.color+'">'+cat.emoji+' '+cat.label+'</span></div>';
  if(item.note) h += '<div class="detail-section">備註</div><div class="detail-val">'+esc(item.note)+'</div>';
  if(item.address) h += '<div class="detail-section">地址</div><div class="detail-val">'+esc(item.address)+'</div>';
  if(item.link) h += '<div class="detail-section">連結</div><div class="detail-link" onclick="openLink(\''+item.link+'\')">'+esc(item.link)+'</div>';
  h += '<div class="detail-btns">';
  if(item.address) h += '<div class="detail-btn btn-nav" onclick="openMap(\''+item.address+'\')">🗺️ 地圖</div>';
  if(item.address) h += '<div class="detail-btn btn-nav" onclick="openMap(\''+item.address+'\')">🧭 導航</div>';
  h += '<div class="detail-btn" style="background:var(--blue-bg);color:var(--blue)" onclick="shareItinItem(\''+item.id+'\')">📤 分享</div>';
  if(canEditTrip()) h += '<div class="detail-btn btn-edit" onclick="openEditItinItem(\''+item.id+'\')">✏️ 編輯</div>';
  if(canEditTrip()) h += '<div class="detail-btn btn-del" onclick="deleteItinItem(\''+item.id+'\')">🗑 刪除</div>';
  h += '</div></div>';
  return h;
}

window.openTripItem = function(itemId) {
  nav.tripItemId = itemId;
  nav.page = 'tripitem';
  render();
};

// ===== 開銷 =====
// 取得當前使用者的個人旅遊資料
function getMyTripData() { return currentTrip?.userData?.[currentUser.uid]||{}; }
function getMyExpenses() { return getMyTripData().expenses||[]; }
function getMyPacking() { return getMyTripData().packing||[]; }
function getMyShopping() { return getMyTripData().shopping||[]; }
function getMyPrivacy() { return getMyTripData().privacy||{}; }
async function saveMyTripField(field, value) {
  const uid = currentUser.uid;
  const userData = JSON.parse(JSON.stringify(currentTrip.userData||{}));
  if(!userData[uid]) userData[uid]={expenses:[],packing:[],shopping:[],privacy:{}};
  userData[uid][field] = value;
  await updateDoc(getTripDoc(currentTrip.id),{userData});
  if(!currentTrip.userData) currentTrip.userData={};
  if(!currentTrip.userData[uid]) currentTrip.userData[uid]={expenses:[],packing:[],shopping:[],privacy:{}};
  currentTrip.userData[uid][field] = value;
}

function renderPrivacyBar(section, sectionName) {
  const priv = getMyPrivacy();
  const isPublic = priv[section]===true;
  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;">' +
    '<div style="font-size:11px;color:var(--muted)">🔒 個人頁面</div>' +
    '<div style="display:flex;gap:6px;">' +
    '<div style="font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;background:'+(isPublic?'var(--green-bg)':'var(--card2)')+';color:'+(isPublic?'var(--green)':'var(--muted)')+';border:0.5px solid '+(isPublic?'var(--green)':'var(--border2)')+'" onclick="togglePrivacy(\''+section+'\')">'+(isPublic?'🌐 公開':'🔒 不公開')+'</div>' +
    '<div style="font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;background:var(--blue-bg);color:var(--blue);border:0.5px solid var(--blue)" onclick="sharePersonalPage(\''+section+'\',\''+sectionName+'\')">📤 分享</div>' +
    '</div></div>';
}

window.togglePrivacy = async function(section) {
  const priv = {...getMyPrivacy()};
  priv[section] = !priv[section];
  await saveMyTripField('privacy', priv);
  renderPage();
};

window.sharePersonalPage = function(section, name) {
  const link = 'https://funzone-eta.vercel.app?trip='+currentTrip.id+'&uid='+currentUser.uid+'&section='+section;
  if(navigator.share) {
    navigator.share({title: name+' - '+currentTrip.title, text: '查看我的'+name+'：', url: link}).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(link).then(()=>alert('✅ 分享連結已複製！')).catch(()=>alert(link));
  }
};
function renderExpenseTab() {
  const exps = getMyExpenses();
  const sym = getCurrSym(getTripCurrency());
  const total = exps.reduce((s,e)=>s+(e.amount||0),0);
  const bycat = {};
  EXP_CATS.forEach(c=>{ bycat[c.id]=exps.filter(e=>e.cat===c.id).reduce((s,e)=>s+(e.amount||0),0); });
  let h = renderPrivacyBar('expenses','個人開銷');
  h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px">';
  h += '<div><div style="font-size:11px;color:var(--muted)">總花費</div><div style="font-size:22px;font-weight:700;color:var(--amber)">'+sym+total.toLocaleString()+'</div></div>';
  h += '<div class="curr-btn" onclick="openCurrencyPicker()">'+getTripCurrency()+' ▾</div>';
  h += '</div>';
  const topCats = EXP_CATS.filter(c=>bycat[c.id]>0).sort((a,b)=>bycat[b.id]-bycat[a.id]).slice(0,3);
  if(topCats.length) {
    h += '<div class="stat-cards">';
    topCats.forEach(c=>{ h+='<div class="stat-c"><div class="stat-cn">'+sym+bycat[c.id].toLocaleString()+'</div><div class="stat-cl">'+c.emoji+' '+c.label+'</div></div>'; });
    h += '</div>';
  }
  h += '<div class="section-hdr">— 明細 —</div>';
  if(!exps.length) h += '<div class="empty" style="padding:20px">還沒有開銷記錄</div>';
  exps.slice().reverse().forEach(e=>{
    const cat = EXP_CATS.find(c=>c.id===e.cat)||EXP_CATS[7];
    h += '<div class="expense-item">';
    h += '<div class="expense-ico" style="background:var(--card2)">'+cat.emoji+'</div>';
    h += '<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(e.name||cat.label)+'</div>';
    if(e.date) h += '<div style="font-size:11px;color:var(--muted)">'+e.date+'</div>';
    h += '</div>';
    h += '<div style="font-size:14px;font-weight:700;color:var(--amber)">'+sym+(e.amount||0).toLocaleString()+'</div>';
    h += '</div>';
  });
  h += '<div style="height:70px"></div>';
  h += '<div style="position:sticky;bottom:10px;padding:0 16px">';
  h += '<div style="background:var(--amber);color:#000;font-size:14px;font-weight:700;text-align:center;padding:13px;border-radius:12px;cursor:pointer" onclick="openAddExpense()">＋ 新增開銷</div>';
  h += '</div>';
  return h;
}

// ===== 打包清單 =====
function renderPackTab() {
  const items = getMyPacking();
  const done = items.filter(i=>i.checked).length;
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  let h = renderPrivacyBar('packing','打包清單');
  h += '<div style="padding:8px 16px 8px">';
  h += '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><div style="font-size:13px;color:var(--text)">完成 '+done+' / '+items.length+' 項</div><div style="font-size:12px;color:var(--green)">'+pct+'%</div></div>';
  h += '<div style="height:4px;background:var(--border2);border-radius:4px"><div style="height:4px;background:var(--green);border-radius:4px;width:'+pct+'%"></div></div>';
  h += '</div>';
  PACK_CATS.forEach(cat=>{
    const catItems = items.filter(i=>(i.cat||'📦 其他')===cat);
    if(!catItems.length) return;
    h += '<div class="section-hdr">'+cat+'</div>';
    catItems.forEach(item=>{
      h += '<div class="check-item"><div class="check-box'+(item.checked?' on':'')+'" onclick="togglePackItem(\''+item.id+'\')">'+(item.checked?'✓':'')+'</div>';
      h += '<div style="flex:1;font-size:13px;color:'+(item.checked?'var(--muted2)':'var(--text)')+(item.checked?';text-decoration:line-through':'')+'">';
      h += esc(item.name)+'</div>';
      if(canEditTrip()) h += '<div style="color:var(--muted2);font-size:18px;cursor:pointer" onclick="deletePackItem(\''+item.id+'\')">×</div>';
      h += '</div>';
    });
  });
  if(!items.length) h += '<div class="empty" style="padding:20px">還沒有打包清單</div>';
  h += '<div style="height:70px"></div>';
  if(canEditTrip()) {
    h += '<div style="position:sticky;bottom:10px;padding:0 16px">';
    h += '<div style="background:var(--amber-bg);color:var(--amber);border:0.5px solid var(--amber);font-size:14px;font-weight:700;text-align:center;padding:13px;border-radius:12px;cursor:pointer" onclick="openAddPackItem()">＋ 新增項目</div>';
    h += '</div>';
  }
  return h;
}

// ===== 購買清單 =====
function renderShopTab() {
  const items = getMyShopping();
  const sym = getCurrSym(getTripCurrency());
  const pending = items.filter(i=>!i.checked).length;
  const done = items.filter(i=>i.checked).length;
  const totalEst = items.filter(i=>!i.checked&&i.price).reduce((s,i)=>s+(i.price||0),0);

  h += '<div class="stat-c"><div class="stat-cn" style="color:var(--blue)">'+sym+totalEst.toLocaleString()+'</div><div class="stat-cl">預估</div></div>';

    h += '<div class="section-hdr">— 清單 —</div>';
    items.forEach(item=>{
      h += '<div class="check-item">';

      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-size:13px;font-weight:600;color:'+(item.checked?'var(--muted2)':'var(--text)')+(item.checked?';text-decoration:line-through':'')+'"">'+esc(item.name)+'</div>';

  h += '<div style="height:70px"></div>';

    h += '</div>';
  }
  return h;
