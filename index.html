  h += '<div style="padding:8px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--card2);margin:0 14px 8px;border-radius:10px;border:0.5px solid var(--border)">';
  h += '<div><div style="font-size:13px;color:var(--text);font-weight:600)">'+(isPublic?'🌐 公開':'🔒 不公開')+'</div>';
  h += '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+(isPublic?'任何有連結的人都可以查看':'只有同行人員可以查看')+'</div></div>';
  if(isTripOwner()) h += '<div onclick="toggleTripPublic(\''+currentTrip.id+'\')" style="padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:'+(isPublic?'var(--red-bg)':'var(--green-bg)')+';color:'+(isPublic?'var(--red)':'var(--green)')+'">'+(isPublic?'設為不公開':'設為公開')+'</div>';
  h += '</div>';
  h += '<div style="padding:0 16px 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  h += '<div class="detail-btn" style="background:var(--purple-bg);color:var(--purple)" onclick="copyTripLink()">📋 複製連結</div>';
  h += '<div class="detail-btn" style="background:var(--blue-bg);color:var(--blue)" onclick="shareTripPlan()">📤 系統分享</div>';
  h += '</div>';
  h += '<div class="section-hdr" style="margin-top:4px">🔁 從收藏加入行程</div>';
  h += '<div style="padding:0 16px 4px;font-size:11px;color:var(--muted)">選擇已收藏的地點快速加入行程</div>';
  const myItems = items.filter(i=>!i.done).slice(0,5);
  myItems.forEach(item=>{
    const cat = CATS.find(c=>c.id===item.cat)||CATS[0];
    h += '<div class="list-item" style="padding:8px 16px">';
    h += '<div class="list-icon" style="background:'+getCatBg(item.cat)+';font-size:18px">'+cat.emoji+'</div>';
    h += '<div class="list-body"><div class="list-name">'+esc(item.name)+'</div>';
    h += '<div class="list-sub"><span class="stars" style="font-size:10px">'+'★'.repeat(item.stars||0)+'</span></div></div>';
    if(canEditTrip()) h += '<div class="tag tag-eat" style="cursor:pointer" onclick="addFromCollection(\''+item.id+'\')">＋加入</div>';
    h += '</div>';
  });
  return h;
}

window.filterCountries = function(q) {
  const list = document.getElementById('mCountryList');
  if(!list) return;
  const filtered = q ? ALL_COUNTRIES.filter(c=>c.n.includes(q)) : ALL_COUNTRIES;
  list.style.display = 'block';
  list.innerHTML = filtered.map(c=>
    '<div onclick="selectTripCountry(\''+c.e+'\',\''+c.n+'\')" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:0.5px solid var(--border2);cursor:pointer;">'+
    '<span style="font-size:18px">'+c.e+'</span>'+
    '<span style="font-size:13px;color:var(--text)">'+c.n+'</span>'+
    '</div>'
  ).join('') || '<div style="padding:10px;text-align:center;color:var(--muted);font-size:12px">找不到國家</div>';
};

window.selectTripCountry = function(emoji, name) {
  window._tripCountry = {e:emoji, n:name};
  const el = document.getElementById('mCountrySelEmoji');
  const nl = document.getElementById('mCountrySelName');
  if(el) el.textContent = emoji;
  if(nl) nl.textContent = name;
  const list = document.getElementById('mCountryList');
  if(list) list.style.display='none';
  const inp = document.getElementById('mCountrySearch');
  if(inp) inp.value='';
  // 自動填入旅遊名稱
  const title = document.getElementById('mTripTitle');
  if(title && !title.value) title.value = name+'之旅';
};

window.doAddTrip = async function() {
  const title = document.getElementById('mTripTitle').value.trim(); if(!title) return;
  const startDate = document.getElementById('mTripStart').value;
  const days = parseInt(document.getElementById('mTripDays').value)||5;
  const country = window._tripCountry||{e:'🌏',n:'其他'};
  const trip = {
    title, emoji:country.e, country:country.n, startDate, days,
    ownerId: currentUser.uid,
    memberUids: [currentUser.uid],
    members:[{uid:currentUser.uid,name:userProfile.name,photo:userProfile.photo||'',role:'owner'}],
    itinerary:[], userData:{},
    currency:'JPY', status:'planning', createdAt:Date.now()
  };
  const ref = await addDoc(getTripCol(), trip);
  trip.id = ref.id;
  trips.unshift(trip);
  closeModal();
  currentTrip = trip;
  nav.page='tripdetail'; nav.tripTab='itinerary'; nav.tripId=trip.id;
  setupTripListener(trip.id);
  render();
  document.getElementById('headerTitle').textContent = trip.title;
};

    return {...i, name, type:window._selectedTripCat||i.type,
      day:parseInt(document.getElementById('mItinDay').value)||i.day,
      time:document.getElementById('mItinTime').value||'',
      address:document.getElementById('mItinAddr').value.trim(),
      note:document.getElementById('mItinNote').value.trim(),

window.shareTripPlan = function() {
  const t=currentTrip;
  const lines=['✈️ '+t.title];
  if(t.startDate) lines.push('📅 '+t.startDate+' · '+t.days+'天');
  const itin=t.itinerary||[];
  for(let d=1;d<=(t.days||1);d++){
    const dayItems=itin.filter(i=>i.day===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    if(dayItems.length){lines.push('\nDay '+d+':');dayItems.forEach(i=>lines.push('  '+(i.time||'')+'　'+i.name));}
  }
  lines.push('\n來自「我的收藏」旅遊規劃');
  const text=lines.join('\n');
  if(navigator.share) navigator.share({title:t.title,text}).catch(()=>{});
  else navigator.clipboard?.writeText(text).then(()=>alert('✅ 已複製！'));
};

  // 切回自己
  clearFriendListeners();
  viewingUid = null;
  await loadUserData();

  // 建立新 item
  const newItem = {
    country: countryId,
    region,
    cat,
    name: src.name,
    stars: src.stars||0,
    note: src.note||'',
    address: src.address||'',
    link: src.link||'',
    photos: [],
    done: false,
    createdAt: Date.now(),
    copiedFrom: friendUid||''
  };
  items.unshift(newItem);

  // 複製照片（如果有）
  if(src.photos&&src.photos.length) {
    await appendPhotosToCol(currentUser.uid,'items',newItem.id,src.photos);
    newItem.photos = [...src.photos];
    await saveItemMainDoc(newItem,'items');
  }

  nav = {page:'countries',country:null,region:null,cat:null,filter:'all',shopCat:null,prevPage:null,itemId:null,sort:'stars',search:''};

        '<div class="loading">上傳中 '+done+' / '+files.length+'...<br><span style="font-size:12px;color:var(--muted)">請稍候</span></div>';

// ===== 貼上文字解析營業時間 =====

function parseChineseTime(str) {
  if(!str) return '';
  str = str.trim();
  if(/午夜/.test(str)) return '00:00';
  if(/^中午$/.test(str)) return '12:00';
  if(/凌晨/.test(str)) {
    const m = str.match(/(\d{1,2})(?::(\d{2}))?/);
    if(!m) return '';
    return `${String(parseInt(m[1])).padStart(2,'0')}:${m[2]||'00'}`;
  }
  const isPM = /下午|晚/.test(str);
  const isAM = /上午/.test(str);
  const m = str.match(/(\d{1,2})(?::(\d{2}))?(?:\s*[時时])?/);
  if(!m) return '';
  let h = parseInt(m[1]), min = m[2] ? parseInt(m[2]) : 0;
  if(isPM && h < 12) h += 12;
  if(isAM && h === 12) h = 0;
  return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}

function fixAmbiguousTime(open, close, raw) {
  if(open && close && !/[上下]午|晚|午夜|凌晨|中午/.test(raw||'')) {
    const oh = parseInt(open.split(':')[0]);
    const ch = parseInt(close.split(':')[0]);
    // 只有當開始時間很小（<8）才推斷為下午，避免把11:30誤判為23:30
    if((ch > 12 || ch === 0) && oh < 8) return `${oh+12}:${open.split(':')[1]}`;
  }
  return open;
}

// 文字前處理：統一各種破折號、全形符號，並把 tab 展開為換行
function normalizeText(text) {
  return text
    .replace(/[－ー−‐‑‒–—―]/g, '-') // 統一所有破折號
    .replace(/　/g, ' ')              // 全形空格
    .replace(/（/g, '(').replace(/）/g, ')') // 全形括號
    .replace(/\t/g, '\n');            // tab 變換行，讓同行的星期+時間/休息被分開處理
}

function parseHoursFromText(rawText) {
  const text = normalizeText(rawText);
  // 先把每行再拆分：有時候星期和時間在同一行（空格分隔）
  const rawLines = text.split(/[\n\r]+/).map(l=>l.trim()).filter(l=>l.length>0);
  const lines = [];
  const dayRegex = /星期[一二三四五六日天]|週[一二三四五六日天]|周[一二三四五六日天]/;
  const TP = '(中午|[上下]午\\s*\\d{1,2}(?::\\d{2})?(?:\\s*[時时])?|午夜|凌晨\\s*\\d{1,2}(?::\\d{2})?(?:\\s*[時时])?|\\d{1,2}:\\d{2})';
  const timeReg = new RegExp(TP + '\\s*-\\s*' + TP);
  const CLOSED = /公休|休息中|休息|不營業|已關閉/;

  for(const line of rawLines) {
    // 若同一行有星期又有時間/休息，拆成兩行
    if(dayRegex.test(line) && (timeReg.test(line) || CLOSED.test(line))) {
      const dayM = line.match(dayRegex);
      lines.push(dayM[0]); // 星期單獨一行
      const rest = line.replace(dayRegex,'').trim();
      if(rest) lines.push(rest); // 剩餘部分單獨一行
    } else {
      lines.push(line);
    }
  }

  const SKIP = /新增或編輯|評論|最新動態|關於|菜單|相片|總覽|展開/;

  // 偵測格式：交錯 vs 星期全在前
  let firstDay = false, format = 'interleaved';
  for(const line of lines) {
    if(SKIP.test(line)) continue;
    if(dayRegex.test(line)) {
      if(firstDay) { format = 'days-first'; break; }
      firstDay = true;
    } else if(firstDay && (timeReg.test(line) || CLOSED.test(line))) {
      format = 'interleaved'; break;
    }
  }

  return format === 'interleaved'
    ? parseInterleaved(lines, dayRegex, timeReg, SKIP, CLOSED)
    : parseDaysFirst(lines, dayRegex, timeReg, SKIP, CLOSED);
}

// 格式二：星期和時間交錯排列（支援成對對應）
function parseInterleaved(lines, dayRegex, timeReg, SKIP, CLOSED) {
  CLOSED = CLOSED || /公休|休息中|休息|不營業|已關閉/;
  const results = [], dayOrder = [], daysData = {};

  // 第一步：把所有行解析成結構化列表
  const tokens = [];
  for(const line of lines) {
    if(SKIP.test(line)) continue;
    const dayM = line.match(dayRegex);
    if(dayM) {
      tokens.push({type:'day', day:dayM[0]});
    } else if(timeReg.test(line)) {
      const m = line.match(timeReg);
      let open = parseChineseTime(m[1]);
      const close = parseChineseTime(m[2]);
      open = fixAmbiguousTime(open, close, m[1]);
      if(open && close) tokens.push({type:'time', open, close});
    } else if(CLOSED.test(line)) {
      tokens.push({type:'closed'});
    } else if(/營業時間可能不同/.test(line)) {
      tokens.push({type:'note', note:'營業時間可能不同'});
    }
  }

  // 第二步：處理 tokens
  let i = 0;
  while(i < tokens.length) {
    if(tokens[i].type !== 'day') { i++; continue; }

    // 收集連續的星期
    const days = [];
    while(i < tokens.length && tokens[i].type === 'day') {
      const d = tokens[i].day;
      if(!daysData[d]) { daysData[d]={slots:[],closed:false,note:''}; dayOrder.push(d); }
      days.push(d);
      i++;
    }

    if(days.length === 1) {
      // 單一星期：收集後面所有非星期的 token
      const day = days[0];
      while(i < tokens.length && tokens[i].type !== 'day') {
        const t = tokens[i];
        if(t.type==='time' && !daysData[day].closed) daysData[day].slots.push({open:t.open,close:t.close});
        else if(t.type==='closed') { daysData[day].closed=true; daysData[day].note='公休'; }
        else if(t.type==='note' && !daysData[day].closed) daysData[day].note=t.note;
        i++;
      }
    } else {
      // 多個連續星期：後面的 token 一對一對應
      // time/closed 對應到各星期（各占一個），note 貼到前一個
      let dayIdx = 0;
      while(i < tokens.length && tokens[i].type !== 'day') {
        if(dayIdx >= days.length) { i++; continue; }
        const t = tokens[i];
        const day = days[dayIdx];
        if(t.type==='time') {
          if(!daysData[day].closed) daysData[day].slots.push({open:t.open,close:t.close});
          dayIdx++; i++;
        } else if(t.type==='closed') {
          daysData[day].closed=true; daysData[day].note='公休';
          dayIdx++; i++;
        } else if(t.type==='note') {
          // note 貼到前一個星期（剛剛處理完的那個）
          const prevDay = dayIdx > 0 ? days[dayIdx-1] : day;
          if(!daysData[prevDay].closed) daysData[prevDay].note=t.note;
          i++;
          // 不推進 dayIdx
        } else {
          i++;
        }
      }
    }
  }

  dayOrder.forEach(day => {
    const d = daysData[day];
    if(d.closed || !d.slots.length) results.push({days:day,open:'',close:'',note:d.note||'公休'});
    else d.slots.forEach(s=>results.push({days:day,open:s.open,close:s.close,note:d.note}));
  });
  return results;
}

// 格式一：星期全在前，時間全在後
function parseDaysFirst(lines, dayRegex, timeReg, SKIP, CLOSED) {
  CLOSED = CLOSED || /公休|休息中|休息|不營業|已關閉/;
  const results = [], dayNames = [], groups = [];
  let curTimes = [], foundFirstTime = false;
  for(const line of lines) {
    if(SKIP.test(line)) continue;
    if(!foundFirstTime) {
      if(timeReg.test(line) || /公休|休息中/.test(line)) foundFirstTime = true;
      else if(dayRegex.test(line)) { dayNames.push(line.match(dayRegex)[0]); continue; }
      else continue;
    }
    if(/營業時間可能不同/.test(line)) {
      if(curTimes.length) { groups.push({times:[...curTimes],note:'營業時間可能不同'}); curTimes=[]; }
      else if(groups.length) groups[groups.length-1].note='營業時間可能不同';
    } else if(CLOSED.test(line)) {
      if(curTimes.length) { groups.push({times:[...curTimes],note:''}); curTimes=[]; }
      groups.push({times:[],note:'公休'});
    } else if(timeReg.test(line)) {
      const m = line.match(timeReg);
      let open = parseChineseTime(m[1]);
      const close = parseChineseTime(m[2]);
      open = fixAmbiguousTime(open, close, m[1]);
      if(open && close) curTimes.push({open, close});
    }
  }
  if(curTimes.length) {
    const rem = dayNames.length - groups.length;
    if(rem > 0 && curTimes.length % rem === 0) {
      const s = curTimes.length/rem;
      for(let i=0;i<curTimes.length;i+=s) groups.push({times:curTimes.slice(i,i+s),note:''});
    } else groups.push({times:curTimes,note:''});
  }
  dayNames.forEach((day,i) => {
    const g = groups[i]; if(!g) return;
    if(!g.times.length) results.push({days:day,open:'',close:'',note:g.note||'公休'});
    else g.times.forEach(t=>results.push({days:day,open:t.open,close:t.close,note:g.note}));
  });
  return results;
}


window.pasteHoursText = function() {
  const wrap = document.getElementById('hoursWrap');
  if(!wrap) return;
  wrap.innerHTML = `

// ===== SWIPER =====
function initSwipers() {
  document.querySelectorAll('.photo-swiper').forEach(sw=>{
    const track = sw.querySelector('.photo-swiper-track'); if(!track) return;
    const count = parseInt(sw.dataset.count)||0;
    const itemId = sw.dataset.id;
    let idx=0, startX=0, startY=0, startTime=0, wasSwiped=false;

    function goTo(i) {
      if(i<0)i=0; if(i>=count)i=count-1;
      idx=i; sw.dataset.idx=i;
      track.style.transform=`translateX(-${i}00%)`;
      sw.querySelectorAll('.photo-dot').forEach((d,di)=>d.classList.toggle('on',di===i));
      const badge=sw.querySelector('.photo-count'); if(badge) badge.textContent=`${i+1} / ${count}`;
    }

    function tryOpenLightbox(target) {
      const isBtn = target.closest('.photo-add-btn')||target.closest('.photo-del-btn')||target.closest('.photo-btn-row');
      if(!isBtn && count>0) {
        setTimeout(()=>openLightbox(itemId, idx), 10);
      }
    }

    // 手機 touch
    let touchHandled = false;
    sw.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      startTime=Date.now();
      wasSwiped=false;
      touchHandled=false;
    },{passive:true});

    sw.addEventListener('touchend',e=>{
      const dx=startX-e.changedTouches[0].clientX;
      const dy=Math.abs(e.changedTouches[0].clientY-startY);
      const dt=Date.now()-startTime;
      if(Math.abs(dx)>40 && dy<60){
        wasSwiped=true;
        if(dx>0)goTo(idx+1);else goTo(idx-1);
      } else if(Math.abs(dx)<15 && dy<15 && dt<400){
        touchHandled=true;
        tryOpenLightbox(e.target);
      }
    },{passive:true});

    // 電腦 click (方便測試)
    sw.addEventListener('click',e=>{
      if(wasSwiped){wasSwiped=false;return;}
      if(touchHandled){touchHandled=false;return;}
      tryOpenLightbox(e.target);
    });
  });
}

function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
